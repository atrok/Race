<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
            background: #A6C9CB;
        }

        #info {
            position: absolute;
            width: 400px;
            height: 50px;
            top: 560px;
            left: 10px;
            z-index: 4;
            font-style: 24px bold #FFF;
        }

        #result {
            position: absolute;
            width: 200px;
            height: 100px;
            top: 200px;
            left: 156px;
            z-index: 4;
            border: 10px solid #FFF;
            background: blanchedalmond;
            display: block;
        }

        #stage {
            width: 512px;
            height: 600px;
            position: relative;
            border: 2px solid black;
        }

        canvas {
            position: absolute;
        }

        #background-layer {
            z-index: 1;
        }

        #gameCanvas {
            z-index: 3;
        }

        #ui-layer {
            z-index: 2;
            background: #000fff;
        }
    </style>
</head>

<body>
    <!--canvas id="gameCanvas" width="400" height="500"></canvas-->

    <div id="stage">
        <!--canvas id="background-layer" width="400" height="600"></canvas-->
        <canvas id="gameCanvas" width="512" height="550"></canvas>
        <canvas id="ui-layer" width="512" height="600"></canvas>
    </div>
    <div id="result">Press Space to start</div>
    <div id="info">Press Space to start</div>



    <script>
        const canvas = document.getElementById("gameCanvas");
        const ui = document.getElementById("ui-layer");
        const ctx = canvas.getContext("2d");
        const ctx_ui = ui.getContext("2d");

        const carWidth = 40;
        const carHeight = 70;
        const carBuffer = 50
        const numberOfLanes = 4;
        const laneWidth = canvas.width / numberOfLanes;
        const initYmin = canvas.height - carHeight - carBuffer;
        const initYmax = carBuffer;
        const shift_x = laneWidth;
        const shift_y = 20;
        const shift_speed = 0.5;
        const maxSpeed = 10;
        const minSpeed = 0;
        const otherCarSpeed = 1


        var maxOtherCars = 0;
        var finishline = -10000;
        var maxStars = 0;
        var starsCollected = 0;

        var lanes = [];
        var bg_objects = [];
        var updateObjectsInOrder = [];
        var removedObjects = [];
        var ongoingTouches = [];
        var playerCar = null;
        var level = 1;
        var life = 3;

        //const lane = 

        /* game session stats */
        var startTime, endTime;
        var bestTime = 0;
        var maxSpeedStat = 0;
        var timeToTarget = function (dist, speed) {
            return Math.ceil((Math.abs(dist) - (canvas.height + carHeight + carBuffer)) / speed * 60)
        }


        const gameObjects = {
            "playerCar": {
                src: "files/images/PNG/Cars/car_blue_small_1.png",
            },
            "othercar": {
                src: "files/images/PNG/Cars/car_black_small_1.png",
                width: 40,
                height: 70,
            },
            "background": {
                src: [
                    "files/images/PNG/Tiles/Asphalt road/road_asphalt21.png",
                    "files/images/PNG/Tiles/Asphalt road/road_asphalt22.png",
                    "files/images/PNG/Tiles/Asphalt road/road_asphalt22.png",
                    "files/images/PNG/Tiles/Asphalt road/road_asphalt23.png",
                ]
            },
            "finishline": {
                src: "files/images/PNG/Objects/finishline.png"
            },
            "star": {
                src: "files/images/PNG/Objects/cone_straight.png",
                width: 40,
                height: 40,
            }

        }



        const events = {
            "collision": function (obj) {
                let e = new CustomEvent("collision", {
                    bubbles: true,
                    detail: obj
                })
                return e;

            },
            "ArrowRight": function () {
                return { type: "keydown", code: "ArrowRight" }
            },
            "ArrowLeft": function () {
                return { type: "keydown", code: "ArrowLeft" }
            },
            "ArrowUp": function () {
                return { type: "keydown", code: "ArrowUp" }
            },
            "ArrowDown": function () {
                return { type: "keydown", code: "ArrowDown" }
            }

        }

        const background = [
            "files/images/PNG/Tiles/Asphalt road/road_asphalt21.png",
            "files/images/PNG/Tiles/Asphalt road/road_asphalt22.png",
            "files/images/PNG/Tiles/Asphalt road/road_asphalt22.png",
            "files/images/PNG/Tiles/Asphalt road/road_asphalt23.png",
        ];


        var gamegoing = false;
        var initialized = false;
        var spacehit = false;

        function init() {
            spacehit = false;
            maxOtherCars = level * 20;
            maxStars = maxOtherCars * 0.2;
            //finishline = -level * 1000;
            starsCollected = 0;

            startTime = Date.now();
            lanes = Array(numberOfLanes);
            bg_objects = new Array();
            updateObjectsInOrder = new Array();
            visibilityOff("result");

            // order is important since other objects rely on playercar to get the speed
            createPlayerCar();
            createBackground();
            createFinishLine();
            createOtherCars();

            document.addEventListener("touchstart", handleStart);
            document.addEventListener("touchend", handleEnd);
            document.addEventListener("touchcancel", handleCancel);
            document.addEventListener("touchmove", handleMove);

            gamegoing = true;
            initialized = true;

            update();

        }


        function createCarObject(type, lane, id, x, y, width, height, speed, img_src, shiftx, shifty, fn) {

            let img = new Image();
            img.src = img_src;

            return {
                type: type,
                lane: lane,
                id: getUniqID(),
                x: x,
                y: y,
                width: width,
                height: height,
                speed: speed,
                //color: "blue",
                img: img,
                shiftx: (shiftx) ? shiftx : 0,
                shifty: (shifty) ? shifty : 0,

                drawImage: (fn) ? fn : function (ctx) {

                    this.changeSpeed();

                    if (this.y >= -this.height || this.y < canvas.heigth + this.height) // to avoid unnescessary drawing operation
                        ctx.drawImage(this.img, this.x + this.shiftx, this.y + this.shifty)
                },
                changeSpeed: function (speed) {
                    let lane = lanes[this.lane];

                    if (speed)
                        this.y += speed
                    else

                        this.y += lane.speed

                }
            };
        }

        function createBackground() {
            //bg_objects = [];

            background.forEach((src, ind) => {

                let imgH = Math.ceil(canvas.height / 128) + 1;
                let lane = createLane(`bg${ind}`);
                lane.speed = playerCar.speed;
                let y = -128;
                let x

                for (let i = 0; i < imgH; i++) {

                    lane.cars.push(
                        createCarObject(
                            "background",
                            lane.id,
                            i, //id
                            ind * 128, //x
                            (i * 128),//y
                            128,//width
                            128,//heigth
                            //speed: otherCarSpeed + Math.random() * 2
                            lane.speed, //speed
                            //color: "grey", 
                            src,//
                            0,
                            (i * 128) - 128,
                            function (ctx, sx, sy) {

                                this.y = ((this.y + playerCar.speed * 1.99) % this.height + this.height) % this.height;// it effectively makes the image y to go in the loop

                                ctx.drawImage(this.img, this.x + this.shiftx, this.y + this.shifty)
                            }


                        )
                    )

                }

                bg_objects.push(lane);
            })
            //return lanes;

            updateObjectsInOrder.push(bg_objects)


        }

        function createPlayerCar() {
            let laneid = Math.floor(Math.random() * 3);
            playerCar = createCarObject(
                "playerCar",
                laneid,
                laneid,
                laneid * laneWidth + (laneWidth - carWidth) / 2,
                initYmin,
                carWidth,
                carHeight,
                5,
                //color: "blue",
                "files/images/PNG/Cars/car_blue_small_1.png",
                0,
                0,
                function (ctx) {
                    ctx.drawImage(this.img, this.x, this.y);
                }
            )
        }

        function createLane(id) {
            return {
                id: id,
                //speed: Math.floor(Math.random() * 3) / 2 + 2,
                speed: id + 1,
                cars: [],
                last_car_y: -0
            }
        }


        function createFinishLine() {
            let finish = createLane('finish');
            finish.speed = playerCar.speed;

            finish.cars.push(
                createCarObject(
                    "finishline",
                    finish.id,
                    'finish',
                    21,//
                    finishline,//
                    500, //width
                    20, //height
                    finish.speed, //speed
                    "files/images/PNG/Objects/finishline.png", //img
                    0,
                    0,
                    function (ctx) {

                        let car = this;

                        car.y += playerCar.speed;
                        if (car.y >= -car.height || car.y < canvas.heigth + car.height) // to avoid unnescessary drawing operation
                            ctx.drawImage(this.img, this.x + this.shiftx, this.y + this.shifty)

                    }
                )
            )

            bg_objects.push(finish);

        }

        function createOtherCars() {

            let distribution = randomTest({
                1: maxOtherCars,
                0: maxStars
            })
            let d = [];



            //for (let i = 0; i < maxOtherCars+maxStars; i++) {
            distribution.forEach((el, i) => {
                let lane = createLane(Math.floor(Math.random() * numberOfLanes));
                if (lanes[lane.id])
                    lane = lanes[lane.id];
                else
                    lanes[lane.id] = lane;

                let objtype = (el == 0) ? "star" : "othercar"



                let car = createCarObject(//createCarObject(id, x,y,width,height,speed,img)
                    objtype,
                    lane.id,
                    i,
                    lane.id * laneWidth + (laneWidth - carWidth) / 2, //x
                    (lane.last_car_y - carBuffer) - carHeight - Math.random() * 100,//y
                    gameObjects[objtype].width, //width
                    gameObjects[objtype].height, // height
                    lane.speed, //speed
                    gameObjects[objtype].src //"files/images/PNG/Cars/car_black_small_1.png"
                );
                lane.cars.push(car);
                lane.last_car_y = car.y
                console.log(`Creating a car (attempt ${i + 1}\nlanes: ${JSON.stringify(lanes)}}`)
            })
            updateObjectsInOrder.push(lanes);

            //return lanes;
        }

        // Function to check for collision between two rectangles
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y;
        }

        function update() {

            if (gamegoing) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                updateObjectsInOrder.forEach(obj =>
                    obj.forEach(lane => {
                        lane.cars.forEach((car, ind) => {
                            if (removedObjects.includes(car.id)) { // code to remove rewards from screen
                                lane.cars.splice(ind, 1)
                            } else {
                                car.drawImage(ctx)
                                //console.log(`lane:${lane.id} car:${JSON.stringify(car)}, playerCar.speed:${playerCar.speed}`)
                                if (isColliding(car, playerCar)) {
                                    let e = events.collision(car)
                                    document.dispatchEvent(e);
                                }
                            }
                        })
                    })
                )

                playerCar.drawImage(ctx);
                let sp = playerCar.speed * 12;
                maxSpeedStat = (sp > maxSpeedStat) ? sp : maxSpeedStat
                info.textContent = `Speed: ${playerCar.speed * 12}mph, max speed: ${maxSpeedStat}mph, best time:${bestTime} sec, lifes:${life}, level:${level}, stars:${starsCollected}`
                console.log(`gamegoing: ${gamegoing}`)
                requestAnimationFrame(update);
            }

        }

        function movePlayerCar(event) {
            let eventCode = "";

            switch (event.type) {
                case "keydown":
                    eventCode = event.code;
                    break;
                case "touchstart":
                    //event.preventDefault();
                    let touch = event.changedTouches[0];
                    let split = canvas.width / 2;
                    (touch.pageX < split) ? eventCode = "ArrowLeft" : eventCode = "ArrowRight"
                    break;
                case "touchend":
                case "touchcancel":
                case "touchmove":
                    eventCode = event.type;
                    break;

            }



            switch (eventCode) {
                case "touchstart":

                case 'ArrowLeft':
                    if (playerCar.x > 0 && playerCar.x >= laneWidth) {
                        //playerCar.x -= laneWidth;
                        playerCar.x -= shift_x
                        playerCar.lane--;
                    }

                    break;
                case 'ArrowRight':
                    if (playerCar.x < canvas.width - laneWidth) {
                        //playerCar.x += laneWidth;
                        playerCar.x += shift_x
                        playerCar.lane++;
                    }

                    break;
                case "ArrowUp":
                    lanes.forEach(lane => {
                        //if (lane.id != playerCar.id)
                        lane.speed += shift_speed

                    })
                    playerCar.speed += shift_speed
                    playerCar.speed = playerCar.speed > maxSpeed ? maxSpeed : playerCar.speed;

                    if (playerCar.y > initYmax)
                        playerCar.y -= shift_y;
                    else
                        playerCar.y = initYmax;


                    break;
                case "ArrowDown":
                    lanes.forEach(lane => {
                        //   if (lane.id != playerCar.id)
                        lane.speed -= shift_speed

                    })
                    playerCar.speed -= shift_speed
                    playerCar.speed = playerCar.speed < minSpeed ? minSpeed : playerCar.speed;

                    if (playerCar.y < initYmin)
                        playerCar.y += shift_y;
                    else
                        playerCar.y = initYmin;

                    console.log(`playerCar.y:${playerCar.y}, initYmin:${initYmin}`)



                    break;

                case 'Space':
                    if (spacehit == true) {
                        event.preventDefault()
                    } else {
                        gamegoing = false;
                        initialized = false;
                        spacehit = true;
                        result.textContent = `Level ${level}`
                        visibilityOn("result");
                        setTimeout(init, 1000);
                    }
                    break;
                case "Escape":
                    if (initialized) {
                        switch (gamegoing) {
                            case true:
                                gamegoing = false;
                                console.log('Game on pause')
                                result.textContent = `Paused\nPress Esc to unpause`;
                                visibilityOn("result");
                                break;
                            case false:
                                gamegoing = true;
                                update();
                                console.log("Game is resumed")
                                visibilityOff("result");
                        }
                    };
                default:
                    console.log(`event.key: ${eventCode}`)

            }
        }
        function processCollision(event) {
            console.log(`Event [${event.type}] detected, details: ${JSON.stringify(event.detail)}`)
            gamegoing = false;
            initialized = false;
            let finishtime = Math.floor((Date.now() - startTime) / 1000);
            switch (event.detail.type) {
                case "background":
                    gamegoing = true;
                    initialized = true;
                    break;
                case "star":
                    console.log(`Collision detected with ${JSON.stringify(event.detail)}`);
                    let obj = event.detail;
                    gamegoing = true;
                    initialized = true;
                    starsCollected++;
                    removedObjects.push(obj.id);
                    break;

                case "othercar":
                    console.log(`Collision detected with ${JSON.stringify(event.detail)}`);
                    //console.log(`Crashed in: ${finishtime} sec`);
                    result.textContent = `Crashed in: ${finishtime} sec`;

                    life--;

                    if (life == 0) {
                        life = 3
                        level = 1
                    }

                    visibilityOn("result");
                    break;
                case "finishline":

                    //ctx.font = '20px Arial bold';
                    //ctx.fillStyle = 'white'

                    // Draw text on the canvas
                    level++;
                    bestTime = (finishtime < bestTime || bestTime == 0) ? finishtime : bestTime;

                    //ctx.fillText(`Finished in: ${finishtime} sec`, 100, 50);
                    result.textContent = `Finished in: ${finishtime} sec`;
                    visibilityOn("result");
                    break;

            }

        }

        function visibilityOn(name) {
            var div = document.getElementById(name);

            div.style.display = "block";


        }

        function visibilityOff(name) {
            var div = document.getElementById(name);

            div.style.display = "none";

        }

        document.addEventListener('keydown', movePlayerCar);
        document.addEventListener('collision', processCollision);

        let result = document.getElementById("result");
        result.addEventListener("touchstart", init)



        function randomTest(obj) {
            let a = new Array(obj[0] + obj[1]);
            let distribution = obj;
            let b = { 0: 0, 1: 0 }
            let i = 0;

            function getRandomInt(max) {
                return Math.floor(Math.random() * max);
            }

            while (b[0] < distribution[0] || b[1] < distribution[1]) {
                let el = getRandomInt(2);
                if (b[el] < distribution[el]) {
                    a[i] = el;
                    b[el]++;
                    i++;
                }

            }

            console.log(JSON.stringify(a))

            console.log(JSON.stringify(b))

            return a;

        }

        function getUniqID() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }
        // createOtherCars();
        // update();

        function handleStart(evt) {
            //evt.preventDefault();
            const touches = evt.changedTouches;
            for (let i = 0; i < touches.length; i++) {
                console.log(`touchstart: ${i}.`);
                ongoingTouches.push(copyTouch(touches[i]));
            }
        }
        function handleMove(evt) {
           // evt.preventDefault();
            const touches = evt.changedTouches;

            for (let i = 0; i < touches.length; i++) {

                //const idx = ongoingTouchIndexById(touches[i].identifier);
                const savedTouch = ongoingTouches.find(({ identifier }) => identifier === touches[i].identifier)

                if (savedTouch) {
                    console.log(`continuing touch ${savedTouch.identifier}`);

                    let currentTouch = touches[i];
                    // determine the direction of the touch move

                    let deltaX = currentTouch.pageX - savedTouch.pageX;
                    let deltaY = currentTouch.pageY - savedTouch.pageY;
                    let deltaXY = Math.abs(deltaX) - Math.abs(deltaY); // deltaXY>0 horisontal move, else vertical move
                    let code = "";

                    if (deltaXY > 0) {//horisontal move
                        if (deltaX < 0)
                            code = "ArrowLeft";
                        if(deltaX > 0)
                        code = "ArrowRight";

                    } else {// vertical move

                        if (deltaY < 0)
                            code = "ArrowDown";
                        if(deltaY > 0)
                        code = "ArrowUp";
                    }

                    movePlayerCar(events[code]())


                    ongoingTouches.splice(savedTouch.identifier, 1, copyTouch(touches[i])); // swap in the new touch record
                } else {
                    log("can't figure out which touch to continue");
                }
            }
        }
        function handleEnd(evt) {
            //evt.preventDefault();
            const touches = evt.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                let idx = ongoingTouches.find(({ identifier }) => identifier === touches[i].identifier);

                if (idx) {
                    ongoingTouches.splice(idx.identifier, 1); // remove it; we're done
                } else {
                    log("can't figure out which touch to end");
                }
            }
        }

        function handleCancel(evt) {
            //evt.preventDefault();
            log("touchcancel.");
            const touches = evt.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                let idx = ongoingTouches.find(({ identifier }) => identifier === touches[i].identifier);
                ongoingTouches.splice(idx.identifier, 1); // remove it; we're done
            }
        }


        function copyTouch({ identifier, pageX, pageY }) {
            return { identifier, pageX, pageY };
        }

        function ongoingTouchIndexById(idToFind) {
            for (let i = 0; i < ongoingTouches.length; i++) {
                const id = ongoingTouches[i].identifier;

                if (id === idToFind) {
                    return i;
                }
            }
            return -1; // not found
        }


    </script>
</body>

</html>
